services:

  mysql:
    image: mysql:8.0
    container_name: matrice-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: matrice_competences

   

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/matrice_competences.sql:/docker-entrypoint-initdb.d/matrice_competences.sql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: matrice-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/matrice_competences
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    ports:
      - "8080:8080"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: matrice-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"


volumes:
  mysql_data: