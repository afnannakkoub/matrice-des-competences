<div class="profile-page">

    <!-- HEADER -->

    <div class="page-header">

        <div>

            <h1>
                <i class="bi bi-person-circle"></i>
                My Profile
            </h1>

            <p>
                View and manage your personal information.
            </p>

        </div>

        <button
            class="btn-back"
            (click)="goDashboard()"
        >
            <i class="bi bi-arrow-left"></i>
            Dashboard
        </button>

    </div>


    <!-- LOADING -->

    <div
        *ngIf="loading"
        class="loading"
    >

        <div class="spinner-border"></div>

        <p>
            Loading your profile...
        </p>

    </div>


    <!-- ERROR -->

    <div
        *ngIf="!loading && error"
        class="error-message"
    >

        {{ error }}

    </div>


    <!-- PROFILE -->

    <div
        *ngIf="!loading && employee"
        class="profile-card"
    >

        <!-- PROFILE HEADER -->

        <div class="profile-header">

            <div class="avatar">

                <i class="bi bi-person"></i>

            </div>

            <div>

                <h2>
                    {{ employee.prenom }}
                    {{ employee.nom }}
                </h2>

                <p>
                    {{ employee.poste }}
                </p>

            </div>

        </div>


        <!-- INFORMATION -->

        <div class="profile-body">

            <div class="section-title">

                <h3>
                    Personal Information
                </h3>

            </div>


            <!-- FIRST NAME -->

            <div class="form-group">

                <label>
                    First Name
                </label>

                <input
                    type="text"
                    [(ngModel)]="employee.prenom"
                    [disabled]="!editMode"
                >

            </div>


            <!-- LAST NAME -->

            <div class="form-group">

                <label>
                    Last Name
                </label>

                <input
                    type="text"
                    [(ngModel)]="employee.nom"
                    [disabled]="!editMode"
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    [(ngModel)]="employee.email"
                    [disabled]="!editMode"
                >

            </div>


            <!-- POSTE -->

            <div class="form-group">

                <label>
                    Position
                </label>

                <input
                    type="text"
                    [value]="employee.poste || 'Not assigned'"
                    disabled
                >

            </div>


            <!-- DEPARTMENT -->

            <div class="form-group">

                <label>
                    Department
                </label>

                <input
                    type="text"
                    [value]="employee.departement || 'Not assigned'"
                    disabled
                >

            </div>


            <!-- ROLE -->

            <div class="form-group">

                <label>
                    Role
                </label>

                <input
                    type="text"
                    [value]="employee.role || 'Employee'"
                    disabled
                >

            </div>


            <!-- BUTTONS -->

            <div class="actions">

                <!-- EDIT -->

                <button
                    *ngIf="!editMode"
                    class="btn-edit"
                    (click)="editProfile()"
                >

                    <i class="bi bi-pencil"></i>

                    Edit Profile

                </button>


                <!-- SAVE -->

                <button
                    *ngIf="editMode"
                    class="btn-save"
                    (click)="saveProfile()"
                    [disabled]="saving"
                >

                    <i class="bi bi-check-lg"></i>

                    {{ saving ? 'Saving...' : 'Save Changes' }}

                </button>


                <!-- CANCEL -->

                <button
                    *ngIf="editMode"
                    class="btn-cancel"
                    (click)="cancelEdit()"
                >

                    <i class="bi bi-x-lg"></i>

                    Cancel

                </button>

            </div>

        </div>

    </div>

</div>
