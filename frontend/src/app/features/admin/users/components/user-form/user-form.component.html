<form [formGroup]="form"
    (ngSubmit)="submit()" class="row g-3">

    <!-- First Name -->

    <div class="col-md-6">

        <label class="form-label">

            First Name

        </label>

        <input
                type="text"
                class="form-control"
                formControlName="prenom">

    </div>

    <!-- Last Name -->

    <div class="col-md-6">

        <label class="form-label">

            Last Name

        </label>

        <input
                type="text"
                class="form-control"
                formControlName="nom">

    </div>

    <!-- Email -->

    <div class="col-md-6">

        <label class="form-label">

            Email

        </label>

        <input
                type="email"
                class="form-control"
                formControlName="email">

    </div>

    <!-- Password -->

    <div class="col-md-6">

        <label class="form-label">

            Password

        </label>

        <input
                type="password"
                class="form-control"
                formControlName="motDePasse">

    </div>

    <!-- Department -->

    <div class="col-md-6">

        <label class="form-label">

            Department

        </label>

        <input
                type="text"
                class="form-control"
                formControlName="departement">

    </div>

    <!-- Position -->

    <div class="col-md-6">

        <label class="form-label">

            Position

        </label>

        <input
                type="text"
                class="form-control"
                formControlName="poste">

    </div>

    <!-- Role -->

    <div class="col-md-6">

        <label class="form-label">

            Role

        </label>

        <select
                class="form-select"
                formControlName="role">

            <option [ngValue]="null">

                Select a role

            </option>

            <option
                    *ngFor="let role of roles"
                    [ngValue]="role">

                {{ role.nom }}

            </option>

        </select>

    </div>
    <div
    class="col-md-6"
    *ngIf="isEmployee">

    <label class="form-label">

        Manager

    </label>

    <select
        class="form-select"
        formControlName="manager">

        <option [ngValue]="null">

            Select a manager

        </option>

        <option
            *ngFor="let manager of managers"
            [ngValue]="manager">

            {{ manager.nom }} {{ manager.prenom }}

        </option>

    </select>

</div>
<div
    class="text-danger mt-1"
    *ngIf="
      form.get('manager')?.touched &&
      form.get('manager')?.hasError('required')
    ">

    Please select a manager.

</div>

    <!-- Active -->

    <div class="col-md-6 d-flex align-items-center">

        <div class="form-check form-switch mt-4">

            <input
                    class="form-check-input"
                    type="checkbox"
                    formControlName="actif">

            <label class="form-check-label">

                Active

            </label>

        </div>

    </div>

    <!-- Buttons -->

    <div class="col-12">

        <button
           class="btn btn-primary"
          type="submit"
          [disabled]="form.invalid">

          Save User

       </button>

    </div>

</form>
