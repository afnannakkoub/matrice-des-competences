<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Users</h2>

        <button
        class="btn btn-primary"
        routerLink="/admin/users/add">

            + Add User

     </button>

    </div>

    <div class="row mb-4">

        <div class="col-md-6">

            <input

                    type="text"

                    class="form-control"

                    placeholder="Search user..."

                    [(ngModel)]="search"

                    (input)="filterUsers()">

        </div>

        <div class="col-md-3">

            <select

                    class="form-select"

                    [(ngModel)]="selectedRole"

                    (change)="filterUsers()">

                <option value="ALL">All Roles</option>

                <option value="ADMIN">ADMIN</option>

                <option value="MANAGER">MANAGER</option>

                <option value="EMPLOYE">EMPLOYE</option>

            </select>

        </div>
        <div class="col-md-3">
          <select
               class="form-select"
              [(ngModel)]="selectedDepartment"
            (change)="filterUsers()">

          <option value="ALL">All Departments</option>

             <option
               *ngFor="let dep of departments"
                [value]="dep">

               {{ dep }}

              </option>

          </select>
       </div>
    </div>

    <table class="table table-hover align-middle">

        <thead class="table-light">

        <tr>

            <th>Name</th>

            <th>Email</th>

            <th>Role</th>

            <th>Department</th>
            <th>Manager</th>

            <th>Status</th>

            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr *ngFor="let user of filteredUsers">

            <td>

                {{ user.nom }} {{ user.prenom }}

            </td>

            <td>

                {{ user.email }}

            </td>

            <td>

                {{ user.role.nom }}

            </td>

            <td>

                {{ user.departement }}

            </td>
            <td>

              <ng-container *ngIf="user.manager; else noManager">

               {{ user.manager.nom }} {{ user.manager.prenom }}

              </ng-container>

             <ng-template #noManager>

                       —

             </ng-template>

            </td>

            <td>
                

                <span

                        class="badge"

                        [class.bg-success]="user.actif"

                        [class.bg-danger]="!user.actif">

                    {{ user.actif ? 'Active' : 'Inactive' }}

                </span>

            </td>

            <td>

                <button class="btn btn-warning btn-sm me-2"[routerLink]="['/admin/users/edit', user.id]">

                    ✏

                </button>

                <button class="btn btn-sm btn-outline-danger"
                       (click)="deleteUser(user.id)">

                    🗑

                </button>

            </td>

        </tr>

        </tbody>

    </table>

</div>
