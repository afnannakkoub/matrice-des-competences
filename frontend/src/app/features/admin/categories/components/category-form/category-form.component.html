<form [formGroup]="form" (ngSubmit)="submit()">

    <div class="mb-3">

        <label class="form-label">

            Category Name

        </label>

        <input
            type="text"
            class="form-control"
            formControlName="nom">

    </div>

    <div class="mb-3">

        <label class="form-label">

            Description

        </label>

        <textarea
            rows="4"
            class="form-control"
            formControlName="description">
        </textarea>

    </div>

    <button
        class="btn btn-primary">

        Save

    </button>

</form>
