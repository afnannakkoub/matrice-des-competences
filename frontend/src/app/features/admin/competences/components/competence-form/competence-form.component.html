<form [formGroup]="form"
      (ngSubmit)="submit()">

    <div class="mb-3">

        <label class="form-label">

            Competence Name

        </label>

        <input
            class="form-control"
            formControlName="nom">

    </div>

    <div class="mb-3">

        <label class="form-label">

            Description

        </label>

        <textarea
            rows="4"
            class="form-control"
            formControlName="description">

        </textarea>

    </div>

    <div class="mb-3">

        <label class="form-label">

            Category

        </label>

        <select
            class="form-select"
            formControlName="categorie">

            <option
                [ngValue]="null">

                Select a category

            </option>

            <option
                *ngFor="let category of categories"
                [ngValue]="category">

                {{ category.nom }}

            </option>

        </select>

    </div>

    <div class="form-check mb-4">

        <input
            class="form-check-input"
            type="checkbox"
            formControlName="archive">

        <label class="form-check-label">

            Archived

        </label>

    </div>

    <button
        class="btn btn-primary">

        Save

    </button>

</form>
